<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>


</head>

<body class=" flex justify-center items-center min-h-screen bg-gradient-to-r from-[#1B3C53] via-[#456882] to-[#D2C1B6]">


    <div class="flex flex-col items-center w-full max-w-md px-4">
        <div class="text-center mb-10">
            <img src="./images/user-graduate.svg" alt="Logo"
                class="mx-auto mb-2 rounded-3xl border-4 w-30 border-white/20 shadow-lg">
            <h1 class="text-white text-4xl font-extrabold tracking-tight">ExamPro</h1>
            <p class="text-white/80 text-sm">Your Path To Success</p>
        </div>

        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md relative ">

            <div id="pop-up"
                class="hidden absolute top-0 left-0 w-full  border font-bold rounded-3xl shadow-2xl bg-[#EFEBE7] p-10">

                <span id="icon"> </span>
                <span id="pop-up-text">  </span>


            </div>

            <h2 class="text-[#1B3C53] text-3xl font-bold mb-6 text-center">login</h2>
            <p class="text-center">Welcome Back!</p>
            <p class="text-center text-[#1B3C53] mb-8">Sign in to accsess your exam </p>

            <form onsubmit="formValidation(event)" class=" space-y-4">


                <div>
                    <label class="block text-[#1B3C53] font-semibold mb-1">Email Address</label>
                    <input id="email" type="email" oninput="emailValidation ()"
                        class=" w-full px-4 py-2 rounded-lg border border-[#456882] focus:outline-none focus:ring-2 focus:ring-[#1B3C53]"
                        placeholder="example@gmail.com">
                    <p id="email-error" class="text-red-500 m-2"></p>
                </div>

                <div>
                    <label class="block text-[#1B3C53] font-semibold mb-1">Password</label>
                    <input id="password" type="password" oninput=" passwordValidation ()"
                        class="w-full px-4 py-2 rounded-lg border border-[#456882] focus:outline-none focus:ring-2 focus:ring-[#1B3C53]"
                        placeholder="••••••••">
                    <p id="pass-error" class="text-red-600 m-2"></p>
                </div>

                <button type="submit"
                    class="w-full bg-gradient-to-r from-[#1B3C53] to-[#456882] text-white font-bold py-3 rounded-lg hover:border border-white transition duration-300 shadow-lg">
                    sign in
                </button>
            </form>


            <div class="flex items-center my-6">
                <div class="flex-grow h-px bg-[#456882]/30"></div>

                <span class="px-4 text-sm font-medium text-[#456882] uppercase tracking-wider">
                    New To ExamPro?
                </span>

                <div class="flex-grow h-px bg-[#456882]/30"></div>
            </div>

            <button onclick="window.location.href= 'register.html'"
                class="w-full bg-gradient-to-r from-[#D2C1B6] to-[#456882] text-white font-bold py-3 rounded-lg hover:text-[#456882] transition-all duration-300 shadow-lg">
                sign up
            </button>
        </div>

    </div>
    <script src="./js/gaurd.js"></script>

    <script src="./js/login.js"></script>
</body>

</html>
